<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GFTheme React SDK Preview</title>
    <style>
      body {
        background: #f8fafc;
        margin: 0;
      }

      .demo-shell {
        display: grid;
        gap: 24px;
        margin: 0 auto;
        max-width: 980px;
        padding: 20px;
      }

      .demo-hero {
        background: linear-gradient(135deg, #111827, #f97316);
        border-radius: 28px;
        color: #ffffff;
        display: grid;
        gap: 8px;
        padding: 28px 22px;
      }

      .demo-hero p,
      .demo-hero h1 {
        margin: 0;
      }

      .demo-hero h1 {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: clamp(2rem, 10vw, 4rem);
        line-height: 0.95;
      }

      .demo-hero p {
        color: rgba(255, 255, 255, 0.78);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-hero">
        <p>GFTheme React SDK</p>
        <h1>Preview mobile-first</h1>
        <p>Calendario, paquetes, login y perfil con branding configurable.</p>
      </section>

      <section id="calendar-demo"></section>
      <section id="packages-demo"></section>
      <section id="auth-demo"></section>
      <section id="profile-demo"></section>
    </main>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
